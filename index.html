<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Football RP Online — Prototype P1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="Prototype de football"></canvas>
    <div id="hud">
      <div class="brand">FOOTBALL RP <span>ONLINE</span></div>
      <div class="score"><span id="blue-score">0</span><small>—</small><span id="red-score">0</span></div>
      <div class="clock" id="clock">05:00</div>
    </div>
    <div id="hint">Prototype P1 · Déplacement, sprint, passe et tir</div>
    <div id="controls">
      <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
      <div id="action-buttons">
        <button id="sprint" class="control secondary">SPRINT</button>
        <button id="pass" class="control">PASSE</button>
        <button id="shoot" class="control shoot">TIR</button>
      </div>
    </div>
    <div id="orientation">Tourne ton téléphone en mode paysage pour jouer.</div>
  </main>
  <script src="game.js"></script>
</body>
</html>
