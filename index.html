<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d311f">
  <title>Football RP Online — P3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="Match de football 5 contre 5"></canvas>
    <div id="board">
      <div class="team blue"><i></i><b>BLEU</b></div>
      <div class="sc"><span id="blue-score">0</span><em>–</em><span id="red-score">0</span></div>
      <div class="team red"><b>ROUGE</b><i></i></div>
      <div class="time"><small id="period">1RE PÉRIODE</small><strong id="clock">02:30</strong></div>
    </div>
    <div id="status"></div>
    <div id="stamina"><span>ENDURANCE</span><div><i id="stamina-fill"></i></div></div>
    <div id="controls">
      <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
      <div id="action-buttons">
        <button id="sprint" class="control secondary">SPRINT</button>
        <button id="defend" class="control defend">DÉFENSE</button>
        <button id="pass" class="control">PASSE</button>
        <button id="shoot" class="control shoot">TIR</button>
      </div>
    </div>
    <div id="orientation">Tourne ton téléphone en mode paysage pour jouer.</div>
    <div id="overlay" class="hidden"><div class="overlay-card"><h2 id="overlay-title">Mi-temps</h2><p id="overlay-text"></p></div></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
